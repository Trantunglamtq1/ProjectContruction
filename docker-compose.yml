services:
  # 1. Database: Microsoft SQL Server 2022
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: construction_db
    restart: unless-stopped
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong@Passw0rd123!"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"YourStrong@Passw0rd123!\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # 2. Object Storage: MinIO Open Source (Tương thích AWS S3)
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: construction_minio
    restart: unless-stopped
    ports:
      - "9000:9000"   # MinIO S3 API Endpoint
      - "9001:9001"   # MinIO Web Console UI
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./minio-data:/data
    command: server /data --console-address ":9001"

  # 3. Backend: .NET 8 Web API Clean Architecture
  backend:
    build:
      context: .
      dockerfile: backend/ConstructionProject.API/Dockerfile
    container_name: construction_backend
    restart: unless-stopped
    ports:
      - "5092:5092"
    environment:
      - ConnectionStrings__DefaultConnection=Server=database,1433;Database=ConstructionProjectDb;User Id=sa;Password=YourStrong@Passw0rd123!;TrustServerCertificate=True;MultipleActiveResultSets=true;
      - Storage__Provider=MinIO
      - Storage__MinIO__Endpoint=minio:9000
      - Storage__MinIO__AccessKey=minioadmin
      - Storage__MinIO__SecretKey=minioadmin
      - Storage__MinIO__BucketName=construction-drawings
      - Storage__MinIO__UseSSL=false
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5092
      - EmailSettings__SmtpServer=${EMAIL_SMTP_SERVER:-smtp.gmail.com}
      - EmailSettings__Port=${EMAIL_PORT:-587}
      - EmailSettings__SenderName=${EMAIL_SENDER_NAME:-ConstructInspect System}
      - EmailSettings__SenderEmail=${EMAIL_SENDER:-}
      - EmailSettings__Password=${EMAIL_PASSWORD:-}
      - EmailSettings__EnableSsl=true
    depends_on:
      database:
        condition: service_healthy
      minio:
        condition: service_started

  # 4. Frontend: React 19 SPA + Nginx Reverse Proxy
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: construction_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mssql_data:
    driver: local
