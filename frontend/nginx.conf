# Map để xử lý WebSocket Connection header đúng chuẩn
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;

    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }

    # Tối ưu nén Gzip cho file tĩnh web
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json;

    # Đảm bảo các file ES Module (.mjs) như PDF.js worker luôn trả về đúng MIME type
    location ~* \.mjs$ {
        root /usr/share/nginx/html;
        default_type application/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Phục vụ file tĩnh React SPA
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # DNS Resolver nội bộ Docker (127.0.0.11) tự động re-resolve IP khi backend container khởi động lại
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Reverse proxy chuyển hướng các request API sang backend container
    location /api/ {
        set $backend_upstream "http://backend:5092";
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cho phép tải lên bản vẽ CAD/PDF dung lượng lớn đến 100MB
        client_max_body_size 100M;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Reverse proxy cho SignalR WebSocket Realtime Notifications
    location /hubs/ {
        set $backend_upstream "http://backend:5092";
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;

        # Bắt buộc để WebSocket handshake hoạt động
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Không buffer WebSocket frames
        proxy_buffering off;
        proxy_cache off;

        # Timeout dài để giữ kết nối WebSocket sống
        proxy_connect_timeout 10s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
