server {
    listen 80;
    server_name localhost;

    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }

    # Tối ưu nén Gzip cho file tĩnh web
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json;

    # Đảm bảo các file ES Module (.mjs) như PDF.js worker luôn trả về đúng MIME type
    location ~* \.mjs$ {
        root /usr/share/nginx/html;
        default_type application/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Phục vụ file tĩnh React SPA
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy chuyển hướng các request API sang backend container
    location /api/ {
        proxy_pass http://backend:5092/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cho phép tải lên bản vẽ CAD/PDF dung lượng lớn đến 100MB
        client_max_body_size 100M;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
